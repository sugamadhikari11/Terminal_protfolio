server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name sugamadhikari.com.np www.sugamadhikari.com.np;

    # Force apex host (avoid www / non-www duplicates in Search Console)
    if ($host = www.sugamadhikari.com.np) {
        return 301 https://sugamadhikari.com.np$request_uri;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Next.js Node server (standalone / pm2 / docker)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
