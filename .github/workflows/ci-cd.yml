name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  deploy-to-azure:
    name: Deploy to Azure VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone
        run: npm run build

      - name: Pack standalone deploy bundle
        run: |
          mkdir -p deploy-bundle/.next
          cp -r .next/standalone/. deploy-bundle/
          cp -r .next/static deploy-bundle/.next/static
          cp -r public deploy-bundle/public
          cp scripts/nginx.conf deploy-bundle/nginx.conf
          tar -czf deploy-bundle.tar.gz -C deploy-bundle .

      - name: Copy bundle to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "deploy-bundle.tar.gz"
          target: "/tmp/"

      - name: Install/restart app on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e
            APP_DIR=/home/${USER}/terminal-portfolio
            mkdir -p "$APP_DIR"
            tar -xzf /tmp/deploy-bundle.tar.gz -C "$APP_DIR"
            rm -f /tmp/deploy-bundle.tar.gz

            # Nginx reverse proxy → Next on :3000
            if [ ! -f /etc/nginx/sites-available/portfolio ] || ! cmp -s "$APP_DIR/nginx.conf" /etc/nginx/sites-available/portfolio; then
              sudo cp "$APP_DIR/nginx.conf" /etc/nginx/sites-available/portfolio
              sudo ln -sf /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo nginx -t
              sudo systemctl reload nginx
            fi

            # Ensure Node 24 + pm2
            if ! command -v node >/dev/null 2>&1 || [ "$(node -v | cut -d. -f1 | tr -d v)" -lt 24 ]; then
              curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            cd "$APP_DIR"
            export PORT=3000
            export HOSTNAME=0.0.0.0
            pm2 delete terminal-portfolio >/dev/null 2>&1 || true
            pm2 start server.js --name terminal-portfolio --update-env
            pm2 save
            echo "Next.js deploy completed"
